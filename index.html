<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WEX MolForge Pro - Final con Editor</title>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/@kekule/kekule/dist/kekule.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@kekule/kekule/dist/kekule.css">
<style>
body{margin:0;background:#050505;color:#fff;font-family:system-ui;padding:18px}
h1{margin:0;font-size:30px} .sub{opacity:.6;font-size:12px;margin-bottom:15px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input{padding:11px;border-radius:8px;border:0;width:260px;color:#000}
button{padding:11px 16px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
.b1{background:#fff;color:#000}.b2{background:#1a1a1a;color:#fff;border:1px solid #333}.b3{background:#0ea5e9;color:#fff}
#editor{width:100%;height:380px;background:#fff;border-radius:12px;overflow:hidden}
#viewer{width:100%;height:500px;border:1px solid #222;border-radius:14px;margin-top:12px}
pre{background:#111;padding:10px;border-radius:10px;font-size:11px;overflow:auto;max-height:160px}
</style>
</head>
<body>
<h1>WEX MolForge Pro - WEX Labs</h1>
<div class="sub">Proyecto autonomo mundial MIT - PubChem NIH Public Domain - 115M moleculas - Sin relacion con molconstr.com - Clean room WEX</div>

<div class="bar">
<input id="q" value="aspirin" placeholder="aspirin, caffeine, ibuprofen...">
<button class="b1" onclick="loadPubChem()">Cargar PubChem</button>
<button class="b2" onclick="convertEditorTo3D()">Editor 2D -> 3D</button>
<button class="b2" onclick="download('sdf')">.SDF</button>
<button class="b2" onclick="download('mol')">.MOL</button>
<button class="b3" onclick="downloadZip()">ZIP WEX</button>
</div>

<div id="editor"></div>
<div id="viewer"></div>
<pre id="info">WEX listo. Dibuja arriba o busca una molecula.</pre>

<script>
let composer, viewer, currentSDF="", currentInfo=null;

window.onload = function(){
  // Editor 2D Kekule - 100% MIT open source para WEX
  composer = new Kekule.Editor.Composer(document.getElementById('editor'));
  composer.setPredefinedSetting('molOnly');
  loadPubChem();
}

async function loadPubChem(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  document.getElementById('info').textContent="Buscando "+q+" en PubChem NIH...";
  try{
    const cidJ=await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(q)}/cids/JSON`).then(r=>r.json());
    const cid=cidJ.IdentifierList.CID[0];
    const [sdf,prop]=await Promise.all([
      fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/SDF?record_type=3d`).then(r=>r.text()),
      fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/MolecularFormula,MolecularWeight,IUPACName,CanonicalSMILES/JSON`).then(r=>r.json())
    ]);
    currentSDF=sdf;
    currentInfo={cid,query:q,...prop.PropertyTable.Properties[0]};
    document.getElementById('info').textContent=JSON.stringify(currentInfo,null,2);
    // Cargar en editor 2D
    let mol=Kekule.IO.loadFormatData(sdf,'sdf');
    composer.setChemObj(mol);
    render3D(sdf);
  }catch(e){document.getElementById('info').textContent="Error: "+e.message+" Prueba aspirin, caffeine";}
}

function render3D(sdf){
  const el=document.getElementById('viewer'); el.innerHTML="";
  viewer=$3Dmol.createViewer(el,{backgroundColor:'#0a0a0a'});
  viewer.addModel(sdf,'sdf'); viewer.setStyle({},{stick:{},sphere:{scale:0.24}}); viewer.zoomTo(); viewer.render();
}

function convertEditorTo3D(){
  try{
    const mol=composer.getChemObj();
    const sdf=Kekule.IO.saveFormatData(mol,'sdf');
    currentSDF=sdf; currentInfo={query:document.getElementById('q').value||'wex-custom',source:'WEX Editor'};
    document.getElementById('info').textContent="Molecula dibujada por WEX Editor:\n"+sdf.slice(0,500);
    render3D(sdf);
  }catch(e){alert("Dibuja algo primero");}
}

function downloadFile(c,f){const b=new Blob([c],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;a.click();}
function download(type){
  if(!currentSDF) return alert("Carga o dibuja primero");
  if(type==='sdf') downloadFile(currentSDF,`${currentInfo.query}.sdf`);
  if(type==='mol') downloadFile(currentSDF,`${currentInfo.query}.mol`);
}
async function downloadZip(){
  if(!currentSDF) return alert("Carga o dibuja primero");
  const zip=new JSZip(); zip.file("README.md","WEX MolForge Pro - Proyecto autonomo WEX MIT - Sin relacion con molconstr.com");
  zip.file(`molecules/${currentInfo.query}.sdf`,currentSDF);
  zip.file(`molecules/${currentInfo.query}.json`,JSON.stringify(currentInfo,null,2));
  const blob=await zip.generateAsync({type:"blob"}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`wex-molforge-${currentInfo.query}.zip`; a.click();
}
</script>
</body>
</html>
